name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Release Signing Keystore
        run: |
          mkdir -p android/app/keystore
          keytool -genkeypair -v -keystore android/app/keystore/release.keystore -alias madebymitzi -keyalg RSA -keysize 2048 -validity 10000 -storepass madebymitzi2026 -keypass madebymitzi2026 -dname "CN=MadeByMitzi, OU=Mobile, O=MadeByMitzi, L=Manila, ST=Metro Manila, C=PH"

      - name: Build Android APKs (Release & Debug)
        working-directory: ./android
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/MadeByMitzi-Orders.apk
          cp android/app/build/outputs/apk/debug/*.apk build-output/MadeByMitzi-Orders-Debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MadeByMitzi-Orders-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.3.2
          name: "📱 MadeByMitzi Mobile Order Manager v1.3.2 (Universal Phone & Tablet Release)"
          body: |
            ### 🌸 MadeByMitzi Mobile App (.APK) v1.3.2
            Universal Android Mobile App for instant order alerts, real-time GCash proof inspection, and 1-tap dispatching.
            
            #### 🚀 What's New in v1.3.2:
            - 📱 **Universal Phone & Tablet Compatibility**: Fixed installation and startup crashes on normal smartphones (such as Infinix ZERO 5G 2023, Tecno, Xiaomi, Samsung, and Pixel) while preserving 100% tablet performance.
            - 🔑 **Signed Release APK**: Packaged with official v1 (JAR) & v2 (Full APK) release signatures to prevent OEM package installer / Phone Master / Play Protect rejections on standard phones.
            - 🔔 **Crash-Proof Notification System**: Converted status bar small icon to an official monochrome vector (`ic_notification.xml`) preventing `BadForegroundServiceNotificationException` crashes on Android 12, 13, and 14.
            - 🖼️ **Full Multi-Density Launcher Mipmaps**: Added high-resolution adaptive PNG icons across all screen densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`) plus round icons.
            - ⚡ **Lifecycle & Foreground Guarding**: Foreground order listener and exact alarm scheduling moved to `onResume()` with safe exception fallbacks.
            - 🇵🇭 **Preserved Filipino "Pabileeeee!" Voice Alerts**: Loud, authentic 2-second store alert for incoming orders.
            
            **Download the APK directly to your phone or tablet:**
            👉 Click **`MadeByMitzi-Orders.apk`** below to download and install.
          files: |
            build-output/MadeByMitzi-Orders.apk
            build-output/MadeByMitzi-Orders-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
