name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/MadeByMitzi-Orders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadeByMitzi-Orders-APK
          path: build-output/MadeByMitzi-Orders.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.2
          name: "📱 MadeByMitzi Mobile Order Manager v1.2"
          body: |
            ### 🌸 MadeByMitzi Mobile App (.APK) v1.2
            Official Android Mobile App for instant order alerts, real-time GCash proof inspection, and 1-tap dispatching.
            
            #### 🚀 What's New in v1.2:
            - 🔔 **Ka-Ching! 3x Loop Sound**: Official cash register mechanical latch, dual bell harmonics, and coin jingle looped 3 times!
            - ⚡ **24/7 Sleep & Closed Screen Monitoring**: Powered by Android `AlarmManager` with `RTC_WAKEUP`, `WakeLock`, and Battery Optimization exemption so you never miss an order even when the phone is locked, asleep, or app is swiped away!
            - 🛠️ **Fixed Order Details Modal**: Solved the blurred screen issue on mobile & tablet WebView; bottom sheet displays immediately with customer details, GCash proof, and 1-tap Approve/Decline buttons.
            - 📱 **Tablet & Mobile Responsive**: Centered dialog on tablets, bottom sheet on phones.
            
            **Download the APK directly to your phone or tablet:**
            👉 Click `MadeByMitzi-Orders.apk` below to download and install.
          files: build-output/MadeByMitzi-Orders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
