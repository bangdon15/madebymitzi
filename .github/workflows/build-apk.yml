name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/MadeByMitzi-Orders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadeByMitzi-Orders-APK
          path: build-output/MadeByMitzi-Orders.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.3.1
          name: "📱 MadeByMitzi Mobile Order Manager v1.3.1 (\"Pabileeeee!\" Voice Release)"
          body: |
            ### 🌸 MadeByMitzi Mobile App (.APK) v1.3.1
            Official Android Mobile App for instant order alerts, real-time GCash proof inspection, and 1-tap dispatching.
            
            #### 🚀 What's New in v1.3.1:
            - 📢 **Exact "Pabileeeeeee!" Video Audio**: Extracted the authentic 2-second audio from the requested video (normalized and tuned for loud notification alerts)!
            - 🔇 **Fixed Notification Re-alerting**: Opening the app directly from a notification opens the order sheet silently without replaying the alert.
            - ⚡ **24/7 Sleep & Closed Screen Monitoring**: AlarmManager wakeup cycle continues monitoring orders even while the app is closed or the screen is dark.
            - 📱 **Tablet & Mobile Details Modal**: Responsive sheet and modal with 1-tap Approve & Dispatch / Decline buttons.
            
            **Download the APK directly to your phone or tablet:**
            👉 Click `MadeByMitzi-Orders.apk` below to download and install.
          files: build-output/MadeByMitzi-Orders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
