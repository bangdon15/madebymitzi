name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/MadeByMitzi-Orders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadeByMitzi-Orders-APK
          path: build-output/MadeByMitzi-Orders.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0
          name: "📱 MadeByMitzi Mobile Order Manager v1.0"
          body: |
            ### 🌸 MadeByMitzi Mobile App (.APK)
            Official Android Mobile App for instant order alerts, real-time GCash proof inspection, and 1-tap dispatching.
            
            **Download the APK directly to your phone:**
            👉 Click `MadeByMitzi-Orders.apk` below to download and install.
          files: build-output/MadeByMitzi-Orders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
