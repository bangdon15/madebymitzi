name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/*.apk build-output/MadeByMitzi-Orders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadeByMitzi-Orders-APK
          path: build-output/MadeByMitzi-Orders.apk
          retention-days: 30

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.1
          name: "📱 MadeByMitzi Mobile Order Manager v1.1"
          body: |
            ### 🌸 MadeByMitzi Mobile App (.APK) v1.1
            Official Android Mobile App for instant order alerts, real-time GCash proof inspection, and 1-tap dispatching.
            
            #### 🚀 What's New in v1.1:
            - 🔔 **Ka-Ching! Sound Alert**: Authentic cash register chime whenever a new order arrives!
            - ⚡ **Background & Closed App Alerts**: Active order listener service notifies you even when the app is in the background or closed!
            - 📱 **Tablet & Landscape Optimization**: Optimized dual-column layout and centered modal dialog for tablets and POS displays.
            - 🛠️ **Fixed Order Details Modal**: Pinned action buttons (Approve & Dispatch / Decline) so they are always visible without scrolling issues.
            - 🔗 **Native Notification Bridge**: Direct Android status-bar heads-up notifications with tap-to-open.
            
            **Download the APK directly to your phone or tablet:**
            👉 Click `MadeByMitzi-Orders.apk` below to download and install.
          files: build-output/MadeByMitzi-Orders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
